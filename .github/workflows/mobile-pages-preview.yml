name: PSI mobile main preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: psi-mobile-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml

      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile

      - name: Configure Expo for GitHub Pages base path
        working-directory: mobile
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const baseUrl = process.env.GITHUB_PAGES_BASE_PATH || '/psi-performance-booking-app';
          app.expo.experiments = {
            ...(app.expo.experiments || {}),
            baseUrl,
          };
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE

      - name: Typecheck mobile app
        working-directory: mobile
        run: pnpm typecheck

      - name: Verify review environment isolation
        working-directory: mobile
        run: node --test scripts/test-review-environment.cjs scripts/test-demo-mode.cjs

      - name: Export Expo web preview
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: ''
          EXPO_PUBLIC_SUPABASE_AUTH_ENABLED: 'false'
          EXPO_PUBLIC_SUPABASE_REGISTRATION_ENABLED: 'false'
        run: pnpm export:web

      - name: Add PSI install icon and web app metadata
        working-directory: mobile
        env:
          GITHUB_PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: pnpm prepare:web-install

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages preview
        id: deployment
        uses: actions/deploy-pages@v4
